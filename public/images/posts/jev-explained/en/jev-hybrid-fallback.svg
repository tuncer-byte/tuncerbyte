<svg xmlns="http://www.w3.org/2000/svg" width="1400" height="720" viewBox="0 0 1400 720" role="img" aria-labelledby="title desc">
  <title id="title">Jev hybrid fallback architecture</title>
  <desc id="desc">An input is evaluated by Jev, checked against a confidence threshold, and routed to an automatic action or a System-2 fallback.</desc>
  <defs><filter id="rough" x="-3%" y="-5%" width="106%" height="110%"><feTurbulence type="fractalNoise" baseFrequency="0.008" numOctaves="2" seed="29" result="noise"/><feDisplacementMap in="SourceGraphic" in2="noise" scale="2"/></filter><marker id="arrow" markerWidth="12" markerHeight="12" refX="10" refY="6" orient="auto"><path d="M1 1 L11 6 L1 11" fill="none" stroke="#18181b" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/></marker><style>.box{stroke:#18181b;stroke-width:3;filter:url(#rough)}.line{stroke:#18181b;stroke-width:3;fill:none;stroke-linecap:round;marker-end:url(#arrow);filter:url(#rough)}.title{font:700 34px ui-rounded,"Comic Sans MS",sans-serif;fill:#18181b}.label{font:700 23px ui-rounded,"Comic Sans MS",sans-serif;fill:#18181b}.body{font:18px ui-rounded,"Comic Sans MS",sans-serif;fill:#3f3f46}.small{font:16px ui-rounded,"Comic Sans MS",sans-serif;fill:#52525b}</style></defs>
  <rect width="1400" height="720" fill="#fafafa"/><path d="M42 45 Q700 25 1358 44 M48 675 Q700 696 1352 673" stroke="#d4d4d8" stroke-width="2" fill="none" filter="url(#rough)"/>
  <text x="70" y="92" class="title">Hybrid decision pipeline: start fast, reason when needed</text>
  <rect x="70" y="265" width="230" height="120" rx="7" fill="#e4e4e7" class="box"/><text x="185" y="312" text-anchor="middle" class="label">Input</text><text x="185" y="350" text-anchor="middle" class="body">Message / log / code diff</text>
  <path d="M303 325 L408 325" class="line"/><rect x="415" y="245" width="245" height="160" rx="7" fill="#ccfbf1" class="box"/><text x="537" y="295" text-anchor="middle" class="label">Jev / ~70 ms</text><text x="537" y="335" text-anchor="middle" class="body">Typed decision</text><text x="537" y="370" text-anchor="middle" class="body">+ confidence score</text>
  <path d="M663 325 L763 325" class="line"/><path d="M875 225 L990 325 L875 425 L760 325 Z" fill="#fef3c7" class="box"/><text x="875" y="310" text-anchor="middle" class="label">Confidence</text><text x="875" y="344" text-anchor="middle" class="body">threshold?</text>
  <path d="M992 325 L1092 325" class="line"/><text x="1038" y="304" text-anchor="middle" class="small">Pass</text><rect x="1100" y="245" width="245" height="160" rx="7" fill="#dcfce7" class="box"/><text x="1222" y="297" text-anchor="middle" class="label">Automatic action</text><text x="1222" y="337" text-anchor="middle" class="body">Route / classify</text><text x="1222" y="372" text-anchor="middle" class="body">guardrail / trigger</text>
  <path d="M875 428 L875 510" class="line"/><text x="900" y="476" class="small">Below</text><rect x="695" y="520" width="360" height="125" rx="7" fill="#ffe4e6" class="box"/><text x="875" y="568" text-anchor="middle" class="label">System-2 fallback</text><text x="875" y="605" text-anchor="middle" class="body">LLM reasoning or human review</text><text x="875" y="630" text-anchor="middle" class="small">Only for ambiguous edge cases</text>
</svg>