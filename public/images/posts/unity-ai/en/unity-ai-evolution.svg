<svg xmlns="http://www.w3.org/2000/svg" width="1400" height="680" viewBox="0 0 1400 680" role="img" aria-labelledby="title desc">
  <title id="title">The evolution of Unity AI</title><desc id="desc">Timeline showing Muse and Sentis merging into Unity AI with Unity 6.2, followed by agentic workflows in 2026.</desc>
  <defs>
    <filter id="rough" x="-3%" y="-5%" width="106%" height="110%"><feTurbulence type="fractalNoise" baseFrequency="0.008" numOctaves="2" seed="31" result="noise"/><feDisplacementMap in="SourceGraphic" in2="noise" scale="2"/></filter>
    <marker id="arrow" markerWidth="12" markerHeight="12" refX="10" refY="6" orient="auto"><path d="M1 1 L11 6 L1 11" fill="none" stroke="#18181b" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/></marker>
    <style>.box{stroke:#18181b;stroke-width:3;filter:url(#rough)}.line{stroke:#18181b;stroke-width:4;fill:none;stroke-linecap:round;marker-end:url(#arrow);filter:url(#rough)}.title{font:700 34px ui-rounded,"Comic Sans MS",sans-serif;fill:#18181b}.year{font:700 25px ui-rounded,"Comic Sans MS",sans-serif;fill:#18181b}.label{font:700 22px ui-rounded,"Comic Sans MS",sans-serif;fill:#18181b}.body{font:18px ui-rounded,"Comic Sans MS",sans-serif;fill:#3f3f46}.small{font:16px ui-rounded,"Comic Sans MS",sans-serif;fill:#52525b}</style>
  </defs>
  <rect width="1400" height="680" fill="#fafafa"/><path d="M42 45 Q700 25 1358 44 M48 635 Q700 656 1352 633" stroke="#d4d4d8" stroke-width="2" fill="none" filter="url(#rough)"/>
  <text x="70" y="94" class="title">Muse + Sentis → one unified Unity AI experience</text>
  <path d="M130 355 C430 345 950 360 1260 350" class="line"/>
  <circle cx="230" cy="351" r="14" fill="#0f766e" stroke="#18181b" stroke-width="3"/><circle cx="560" cy="351" r="14" fill="#b45309" stroke="#18181b" stroke-width="3"/><circle cx="890" cy="351" r="14" fill="#be123c" stroke="#18181b" stroke-width="3"/><circle cx="1190" cy="351" r="14" fill="#18181b" stroke="#18181b" stroke-width="3"/>
  <rect x="90" y="155" width="280" height="145" rx="7" fill="#ccfbf1" class="box"/><text x="230" y="195" text-anchor="middle" class="year">2023</text><text x="230" y="232" text-anchor="middle" class="label">Muse</text><text x="230" y="266" text-anchor="middle" class="body">Chat + content generation</text><path d="M230 302 L230 332" stroke="#18181b" stroke-width="3"/>
  <rect x="420" y="400" width="280" height="145" rx="7" fill="#fef3c7" class="box"/><text x="560" y="440" text-anchor="middle" class="year">2023</text><text x="560" y="477" text-anchor="middle" class="label">Sentis</text><text x="560" y="511" text-anchor="middle" class="body">On-device inference</text><path d="M560 370 L560 398" stroke="#18181b" stroke-width="3"/>
  <rect x="745" y="145" width="290" height="160" rx="7" fill="#ffe4e6" class="box"/><text x="890" y="187" text-anchor="middle" class="year">August 2025</text><text x="890" y="226" text-anchor="middle" class="label">Unity 6.2</text><text x="890" y="260" text-anchor="middle" class="body">Assistant + Generators</text><text x="890" y="286" text-anchor="middle" class="small">Unified with Inference Engine</text><path d="M890 307 L890 332" stroke="#18181b" stroke-width="3"/>
  <rect x="1040" y="400" width="300" height="155" rx="7" fill="#e4e4e7" class="box"/><text x="1190" y="440" text-anchor="middle" class="year">2026</text><text x="1190" y="477" text-anchor="middle" class="label">Agentic workflows</text><text x="1190" y="511" text-anchor="middle" class="body">Project context + MCP</text><text x="1190" y="538" text-anchor="middle" class="small">External agents through Gateway</text><path d="M1190 370 L1190 398" stroke="#18181b" stroke-width="3"/>
</svg>