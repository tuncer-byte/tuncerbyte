<svg xmlns="http://www.w3.org/2000/svg" width="1400" height="780" viewBox="0 0 1400 780" role="img" aria-labelledby="title desc">
  <title id="title">Unity AI bileşenleri</title>
  <desc id="desc">Assistant, Generators ve Inference Engine bileşenlerinin Unity Editor, Unity Cloud ve oyuncu cihazı ile ilişkisi.</desc>
  <defs>
    <filter id="rough" x="-3%" y="-5%" width="106%" height="110%">
      <feTurbulence type="fractalNoise" baseFrequency="0.008" numOctaves="2" seed="23" result="noise"/>
      <feDisplacementMap in="SourceGraphic" in2="noise" scale="2"/>
    </filter>
    <marker id="arrow" markerWidth="12" markerHeight="12" refX="10" refY="6" orient="auto">
      <path d="M1 1 L11 6 L1 11" fill="none" stroke="#18181b" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
    </marker>
    <style>
      .box{stroke:#18181b;stroke-width:3;filter:url(#rough)}
      .line{stroke:#18181b;stroke-width:3;fill:none;stroke-linecap:round;marker-end:url(#arrow);filter:url(#rough)}
      .dash{stroke:#71717a;stroke-width:2;stroke-dasharray:9 9;fill:none}
      .title{font:700 34px ui-rounded,"Comic Sans MS",sans-serif;fill:#18181b}
      .label{font:700 24px ui-rounded,"Comic Sans MS",sans-serif;fill:#18181b}
      .body{font:19px ui-rounded,"Comic Sans MS",sans-serif;fill:#3f3f46}
      .small{font:16px ui-rounded,"Comic Sans MS",sans-serif;fill:#52525b}
    </style>
  </defs>
  <rect width="1400" height="780" fill="#fafafa"/>
  <path d="M42 46 Q700 25 1358 45 M48 733 Q700 754 1352 731" stroke="#d4d4d8" stroke-width="2" fill="none" filter="url(#rough)"/>
  <text x="70" y="94" class="title">Unity AI: üç araç, iki çalışma ortamı</text>

  <rect x="70" y="145" width="1260" height="430" rx="8" fill="#ffffff" class="box"/>
  <text x="105" y="190" class="label">Unity Editor</text>
  <path d="M100 212 L1300 212" class="dash"/>

  <rect x="115" y="255" width="325" height="245" rx="7" fill="#ccfbf1" class="box"/>
  <text x="277" y="306" text-anchor="middle" class="label">Assistant</text>
  <text x="277" y="351" text-anchor="middle" class="body">Project context'i okur</text>
  <text x="277" y="386" text-anchor="middle" class="body">C# kodu ve Editor action</text>
  <text x="277" y="421" text-anchor="middle" class="body">Değişikliği doğrular</text>
  <rect x="202" y="451" width="150" height="30" rx="15" fill="#0f766e"/>
  <text x="277" y="472" text-anchor="middle" class="small" fill="#ffffff">Agentic workflow</text>

  <rect x="537" y="255" width="325" height="245" rx="7" fill="#fef3c7" class="box"/>
  <text x="699" y="306" text-anchor="middle" class="label">Generators</text>
  <text x="699" y="351" text-anchor="middle" class="body">Sprite • Texture • Material</text>
  <text x="699" y="386" text-anchor="middle" class="body">Animation • Sound</text>
  <text x="699" y="421" text-anchor="middle" class="body">Unity-ready asset üretir</text>
  <rect x="624" y="451" width="150" height="30" rx="15" fill="#b45309"/>
  <text x="699" y="472" text-anchor="middle" class="small" fill="#ffffff">Unity Cloud</text>

  <rect x="960" y="255" width="325" height="245" rx="7" fill="#ffe4e6" class="box"/>
  <text x="1122" y="306" text-anchor="middle" class="label">Inference Engine</text>
  <text x="1122" y="351" text-anchor="middle" class="body">ONNX model yükler</text>
  <text x="1122" y="386" text-anchor="middle" class="body">CPU / GPU'da inference</text>
  <text x="1122" y="421" text-anchor="middle" class="body">Runtime çıktısı üretir</text>
  <rect x="1047" y="451" width="150" height="30" rx="15" fill="#be123c"/>
  <text x="1122" y="472" text-anchor="middle" class="small" fill="#ffffff">On-device</text>

  <path d="M277 505 C277 552 425 568 515 616" class="line"/>
  <path d="M699 505 C699 552 650 575 618 616" class="line"/>
  <path d="M1122 505 C1122 552 930 573 812 616" class="line"/>
  <rect x="475" y="620" width="390" height="92" rx="7" fill="#e4e4e7" class="box"/>
  <text x="670" y="660" text-anchor="middle" class="label">Oyun projesi</text>
  <text x="670" y="692" text-anchor="middle" class="body">Kod + asset + runtime intelligence</text>
</svg>