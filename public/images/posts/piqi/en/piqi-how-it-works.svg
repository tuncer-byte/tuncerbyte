<svg xmlns="http://www.w3.org/2000/svg" width="1400" height="720" viewBox="0 0 1400 720" role="img" aria-labelledby="title desc">
  <title id="title">How Piqi answers a question in a meeting</title>
  <desc id="desc">Meeting audio is transcribed on the Mac, the question is detected locally, searched in the knowledge base, and ends as a source-linked answer or a document gap.</desc>
  <defs><filter id="rough" filterUnits="userSpaceOnUse" x="0" y="0" width="1400" height="720"><feTurbulence type="fractalNoise" baseFrequency="0.008" numOctaves="2" seed="29" result="noise"/><feDisplacementMap in="SourceGraphic" in2="noise" scale="2"/></filter><marker id="arrow" markerWidth="12" markerHeight="12" refX="10" refY="6" orient="auto"><path d="M1 1 L11 6 L1 11" fill="none" stroke="#18181b" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/></marker><style>.box{stroke:#18181b;stroke-width:3;filter:url(#rough)}.line{stroke:#18181b;stroke-width:3;fill:none;stroke-linecap:round;marker-end:url(#arrow);filter:url(#rough)}.title{font:700 34px ui-rounded,"Comic Sans MS",sans-serif;fill:#18181b}.label{font:700 22px ui-rounded,"Comic Sans MS",sans-serif;fill:#18181b}.body{font:17px ui-rounded,"Comic Sans MS",sans-serif;fill:#3f3f46}.small{font:16px ui-rounded,"Comic Sans MS",sans-serif;fill:#52525b}.tag{font:700 16px ui-rounded,"Comic Sans MS",sans-serif;fill:#3f3f46}</style></defs>
  <rect width="1400" height="720" fill="#fafafa"/><path d="M42 45 Q700 25 1358 44 M48 675 Q700 696 1352 673" stroke="#d4d4d8" stroke-width="2" fill="none" filter="url(#rough)"/>
  <text x="70" y="100" class="title">How Piqi answers a question in a meeting</text>
  <rect x="40" y="265" width="225" height="140" rx="7" fill="#e4e4e7" class="box"/><text x="152.5" y="309" text-anchor="middle" class="label">Meeting audio</text><text x="152.5" y="343" text-anchor="middle" class="body">Teams, Zoom, Meet</text><text x="152.5" y="367" text-anchor="middle" class="body">two channels</text>
  <rect x="310" y="265" width="225" height="140" rx="7" fill="#e4e4e7" class="box"/><text x="422.5" y="309" text-anchor="middle" class="label">Transcription</text><text x="422.5" y="343" text-anchor="middle" class="body">Apple Speech</text><text x="422.5" y="367" text-anchor="middle" class="body">on the Mac</text>
  <rect x="580" y="265" width="225" height="140" rx="7" fill="#e4e4e7" class="box"/><text x="692.5" y="309" text-anchor="middle" class="label">Question check</text><text x="692.5" y="343" text-anchor="middle" class="body">local rules</text><text x="692.5" y="367" text-anchor="middle" class="body">no model call</text>
  <rect x="850" y="265" width="225" height="140" rx="7" fill="#e4e4e7" class="box"/><text x="962.5" y="309" text-anchor="middle" class="label">Local search</text><text x="962.5" y="343" text-anchor="middle" class="body">SQLite FTS5</text><text x="962.5" y="367" text-anchor="middle" class="body">+ concept coverage</text>
  <rect x="1150" y="150" width="210" height="140" rx="7" fill="#ecfccb" class="box"/><text x="1255.0" y="194" text-anchor="middle" class="label">Sourced answer</text><text x="1255.0" y="228" text-anchor="middle" class="body">in the Island,</text><text x="1255.0" y="252" text-anchor="middle" class="body">with its source</text>
  <rect x="1150" y="440" width="210" height="140" rx="7" fill="#e4e4e7" class="box"/><text x="1255.0" y="484" text-anchor="middle" class="label">Document gap</text><text x="1255.0" y="518" text-anchor="middle" class="body">no model call,</text><text x="1255.0" y="542" text-anchor="middle" class="body">added to the list</text>
  <path d="M271 335 Q287 329 304 335" class="line"/>
  <path d="M541 335 Q557 329 574 335" class="line"/>
  <path d="M811 335 Q827 329 844 335" class="line"/>
  <path d="M1080 310 Q1118 236 1146 222" class="line"/><text x="1092" y="246" text-anchor="end" class="tag">strong source</text>
  <path d="M1080 370 Q1118 444 1146 508" class="line"/><text x="1092" y="458" text-anchor="end" class="tag">no source</text>
  <text x="70" y="630" class="small">Raw audio never leaves the Mac · Personal data is masked before text goes to a cloud model · On-prem models supported</text>
</svg>
